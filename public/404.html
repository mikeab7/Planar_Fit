<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Planyr — Not found</title>
<meta name="theme-color" content="#0D1116" />
<meta name="color-scheme" content="dark" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<!-- Archivo (display) + IBM Plex Mono (small mono labels), loaded NON-BLOCKING — same pattern as
     /landing/, /privacy/ and /terms/ (B1384). Nothing on this page depends on the swap landing;
     every word below is plain, fully-opaque HTML from first paint, system-font fallbacks and all
     — load-bearing here twice over, since this file is also served (via _redirects) for a
     stale/deleted build chunk, i.e. exactly when the rest of the app's JS may not be trustworthy. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>

<style>
:root {
  --ground:      #0D1116;
  --ink:         #F4F1E9;
  --ink-2:       #B4BEC9;
  --coral:       #F0705A;
  --coral-hi:    #F98872;
  --coral-deep:  #C9503A;
  --rule:        #22303A;
  --font-display: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  padding: 0;
  background: var(--ground);
  font-family: var(--font-display);
  color: var(--ink);
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 28px; }

header.masthead { flex: 0 0 auto; padding-top: 20px; border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
header.masthead .wrap { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
.brand svg { display: block; border-radius: 6px; }
.brand b { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }

/* flex-start, not center: anchoring the card to the top means an overflow on a short/narrow
   screen only ever grows the page downward, never pushes content up over the masthead — the
   same reasoning /landing/'s own main comment gives for its identical choice. */
main { flex: 1 0 auto; display: flex; align-items: flex-start; justify-content: center; padding: 72px 28px 96px; }
.card { max-width: 480px; width: 100%; text-align: center; }
h1 {
  margin: 0 0 14px;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.1;
  font-size: clamp(1.7rem, 4.4vw, 2.3rem);
}
p {
  margin: 0 0 26px;
  color: var(--ink-2);
  font-size: 0.98rem;
  line-height: 1.65;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  background: var(--coral);
  color: #1A0E0A;
  font-weight: 700;
  font-size: 0.95rem;
  text-decoration: none;
  padding: 12px 24px;
  border-radius: 8px;
  transition: background .15s ease, transform .15s ease;
}
.btn-primary:hover, .btn-primary:focus-visible { background: var(--coral-hi); }
.btn-primary:active { background: var(--coral-deep); transform: translateY(1px); }
</style>
</head>
<body>
<!--
  Served for genuine 404s (and, via _redirects, for missing /assets/* chunks). Kept
  deliberately small — system-font fallbacks paint the words on first paint, fonts load
  non-blocking, no JavaScript at all — so it reads even when the app bundle can't.
-->
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="/landing/" aria-label="Planyr home">
      <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="22" fill="#15171C"/>
        <polygon points="50,60 70,68 50,76 30,68" fill="#A8482B"/><polygon points="30,68 50,76 50,79 30,71" fill="#963F26"/><polygon points="50,76 70,68 70,71 50,79" fill="#823620"/>
        <polygon points="50,39 70,47 50,55 30,47" fill="#DC6B42"/><polygon points="30,47 50,55 50,58 30,50" fill="#C85F3A"/><polygon points="50,55 70,47 70,50 50,58" fill="#B25431"/>
        <polygon points="50,18 70,26 50,34 30,26" fill="#F8946A"/><polygon points="30,26 50,34 50,37 30,29" fill="#E8825A"/><polygon points="50,34 70,26 70,29 50,37" fill="#D6744E"/>
      </svg>
      <b>planyr</b>
    </a>
  </div>
</header>

<main>
  <div class="card">
    <h1>That page isn't here</h1>
    <p>The link may be out of date, or Planyr may have just been updated in the background.</p>
    <p><a class="btn-primary" href="/">Go to Planyr</a></p>
  </div>
</main>
</body>
</html>
